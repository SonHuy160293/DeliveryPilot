groups:
  - name: deliverypilot-projects
    rules:
      - alert: ProjectsOutboxStalled
        expr: deliverypilot_outbox_oldest_pending_age_seconds{service_name="DeliveryPilot.Projects.Worker"} > 300
        for: 2m
        labels: { severity: warning }
        annotations: { summary: "Committed Projects events are waiting for publication" }
      - alert: ProjectsOutboxDeadLetters
        expr: deliverypilot_outbox_dead_letters{service_name="DeliveryPilot.Projects.Worker"} > 0
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "Projects outbox requires operator investigation" }
      - alert: ProjectsWorkerHeartbeatStale
        expr: deliverypilot_outbox_worker_heartbeat_age_seconds{service_name="DeliveryPilot.Projects.Worker"} > 60
        for: 1m
        labels: { severity: critical }
        annotations: { summary: "Projects worker is not completing outbox scans" }
